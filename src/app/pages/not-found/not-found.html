<div class="error-terminal">
  <div class="error-content">
    <div class="error-code">404</div>
    <br>
    <div class="error-title">CRITICAL SYSTEM ERROR</div>
    <div class="error-subtitle">SIGNAL LOST - SECTOR NO ENCONTRADO</div>
    <div class="error-message">
      The requested node is no longer broadcasting. Peripheral sensors indicate 
      a complete breakdown in the communication chain for this logistics sector.
    </div>
    <button class="btn-return" (click)="irAlInicio()">
      ← RETURN TO COMMAND CENTER
    </button>
  </div>
</div>
