<div class="login-bg">
  <!-- Bloques de color de fondo -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="login-card">
    <div class="brand">
      <div class="logo-badge">
        <!-- Visualizador de Audio (Ecualizador) -->
       <div class="logo-wrapper">
 <div class="waves-container">
  <div class="audio-bar b1"></div>
  <div class="audio-bar b2"></div>
  <div class="audio-bar b3"></div>
  <div class="audio-bar b4"></div>
  <div class="audio-bar b5"></div>
</div>

        <div class="logo-text">
          <span class="logo-title">Festival Logistics</span>
          <span class="logo-sub">Gestión de Eventos</span>
        </div>
      </div>
      <p class="brand-subtitle">Inicia sesión para continuar</p>
    </div>

    <!-- Campos de entrada -->
    <div class="field">
      <label>USUARIO</label>
      <input type="text" placeholder="Ingresa tu usuario" [(ngModel)]="username" />
    </div>

    <div class="field">
      <label>CONTRASEÑA</label>
      <input type="password" placeholder="••••••••" [(ngModel)]="password" />
    </div>

    @if (errorMsg) {
      <p class="error-msg">{{ errorMsg }}</p>
    }

    <button class="btn-main" (click)="login()">Iniciar Sesión</button>

    <div class="divider">
      <hr/>
    </div>

    <!-- Registro Mejorado -->
    <p class="register-link">¿Problemas para ingresar? <a href="#">Contacta al administrador</a></p>

    <!-- Indicadores Visuales -->
    <div class="dots">
      <div class="dot" style="background:#7c3aed"></div>
      <div class="dot" style="background:#a855f7"></div>
      <div class="dot" style="background:#db2777"></div>
    </div>
  </div>
</div>
